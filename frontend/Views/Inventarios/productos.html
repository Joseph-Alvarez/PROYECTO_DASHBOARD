<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Productos</title>
    <link rel="stylesheet" href="/frontend/assets/css/styles.css">
    <link rel="stylesheet" href="/frontend/assets/css/styles2.css">
    <link rel="stylesheet" href="/frontend/assets/css/inventario.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
</head>

<body>
    <div id="navbar"></div>
    <div class="layout">
        <div id="sidebar"></div>

        <div class="container mt-6">

            <!-- Encabezado -->
            <div class="page-header">
                <h2>Gestión de Productos</h2>
                <p id="subtitulo">Inventario · cargando...</p>
            </div>

            <!-- Stats -->
            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-label">Total productos</div>
                    <div class="stat-value" id="statTotal">—</div>
                    <div class="stat-sub">En inventario</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">Stock total</div>
                    <div class="stat-value" id="statStock">—</div>
                    <div class="stat-sub">Unidades disponibles</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">Stock bajo</div>
                    <div class="stat-value danger" id="statBajo">—</div>
                    <div class="stat-sub">Menos de 8 unidades</div>
                </div>
            </div>

            <!-- Toolbar -->
            <div class="toolbar">
                <div class="search-box">
                    <i class="bi bi-search"></i>
                    <input type="text" id="buscador" placeholder="Buscar por nombre o categoría..."
                        oninput="filtrarProductos()">
                    <button class="btn-clear" onclick="limpiarBusqueda()">
                        <i class="bi bi-x-lg"></i>
                    </button>
                </div>
                <button class="btn-agregar" onclick="abrirModal()">
                    <i class="bi bi-plus-lg"></i> Agregar Producto
                </button>
            </div>

            <!-- Tabla -->
            <div class="table-card">
                <table class="table table-striped table-bordered mb-0">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Nombre Producto</th>
                            <th>Precio</th>
                            <th>Categoría</th>
                            <th>Stock</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="tablaProductos"></tbody>
                </table>
            </div>
        </div>

        <!-- Modal para Crear/Editar Producto -->
        <div class="modal fade" id="modalProducto" tabindex="-1" aria-hidden="true">
            <div class="modal-dialog">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title">Producto</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                    </div>
                    <div class="modal-body">
                        <form id="formProducto">
                            <input type="hidden" id="productoId">
                            <div class="mb-3">
                                <label for="nombre" class="form-label">Nombre Producto</label>
                                <input type="text" id="nombre" class="form-control" required>
                            </div>
                            <div class="mb-3">
                                <label for="precio" class="form-label">Precio</label>
                                <input type="number" id="precio" class="form-control" required>
                            </div>
                            <div class="mb-3">
                                <label for="categoria" class="form-label">Categoría</label>
                                <input type="text" id="categoria" class="form-control" required>
                            </div>
                            <div class="mb-3">
                                <label for="stock" class="form-label">Stock</label>
                                <input type="text" id="stock" class="form-control" required>
                            </div>
                        </form>
                    </div>
                    <div class="modal-footer">
                        <button class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                        <button class="btn btn-success" onclick="guardarProducto()">Guardar</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/frontend/assets/js/data.js"></script>
    <script src="/frontend/assets/js/app.js"></script>
    <script src="/frontend/assets/js/auth.js"></script>

</body>

</html>
